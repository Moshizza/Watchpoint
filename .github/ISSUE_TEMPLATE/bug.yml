name: Bug
description: Something does not work as specified.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: spec
    attributes:
      label: Spec reference (if known)
      placeholder: "ALM §7.2"
  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted — no secrets or personal data)
      render: text
