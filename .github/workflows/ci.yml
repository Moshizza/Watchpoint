# Main CI workflow (Architecture/README.md §10). Required check for merging into main: "ci-ok".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SOLUTION: src/service/Watchpoint.slnx

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # CI=true (set by GitHub) turns on locked-mode restore and CI builds (Directory.Build.props).
      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build (warnings as errors)
        run: dotnet build "$SOLUTION" --no-restore --configuration Release

      # Unit, integration (Testcontainers; Docker is available on the Linux runner), contract and
      # architecture tests. WATCHPOINT_REQUIRE_CONTAINERS=1 turns "Docker not available" skips into
      # failures (TST §5.4). The .NET 10 test runner fails on a solution without projects, so the
      # step is skipped until the first project is added (T0.03).
      - name: Test
        env:
          WATCHPOINT_REQUIRE_CONTAINERS: "1"
        run: |
          if ! grep -q '<Project ' "$SOLUTION"; then
            echo "No projects in $SOLUTION yet; nothing to test."
            exit 0
          fi
          dotnet test --solution "$SOLUTION" --no-build --configuration Release \
            --results-directory "$GITHUB_WORKSPACE/TestResults"

      # Standard type library (SCM §8); package folders are added here when the first package exists.
      - name: Validate type library
        run: dotnet tools/wptypes/bin/Release/net10.0/wptypes.dll validate types --strict-i18n

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  ui:
    name: UI lint, type-check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks CLI (MIT) from its official image; scans the full history.
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose --exit-code 1 --config .gitleaks.toml /repo

  semgrep:
    name: Static analysis (Semgrep CE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep
        run: >
          semgrep scan
          --config p/csharp
          --config p/typescript
          --config p/secrets
          --config tools/semgrep/watchpoint.yml
          --error
          --metrics off

  # Windows-only code paths: SEC §6.2 DPAPI master key (SEC-U-015); HST §7.3 supervisor on Windows (Job Object,
  # CTRL_BREAK, bundled nats-server: HST-I-005, HST-I-006) and the host unit tests.
  dotnet-windows:
    name: Windows-only tests (secrets, supervisor)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --project tests/service/Watchpoint.Secrets.Tests --configuration Release

      - name: Host unit tests
        run: dotnet test --project tests/service/Watchpoint.Hosting.Tests --configuration Release

      # Real processes, no container: the pinned nats-server release is downloaded and checked by the tests.
      - name: Supervisor integration tests
        run: dotnet test --project tests/service/Watchpoint.IntegrationTests --configuration Release -- --filter-class "*SupervisorIntegrationTests"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [dotnet, dotnet-windows, ui, secret-scan, semgrep]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
