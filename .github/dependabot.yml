# Weekly dependency updates, grouped to keep pull requests few (Architecture/README.md §4:
# upgrades are reviewed like code). Major updates arrive separately.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci(deps)" }
